<svg xmlns="http://www.w3.org/2000/svg" width="980" height="375" viewBox="0 0 980 375" role="img" aria-label="A file travels as light">
<rect width="980" height="375" rx="22" fill="#0c2029"/>
<g font-family="Arial, sans-serif"><text x="36" y="53" fill="#f3fbfd" font-size="29" font-weight="700">A file travels as light</text><text x="36" y="86" fill="#98b5c2" font-size="17">Prepare on one device. Scan and verify on the other.</text><rect x="36" y="128" width="278" height="170" rx="18" fill="#17333d" stroke="#3b6471"/><circle cx="64" cy="158" r="14" fill="#94e1c8"/><text x="64" y="163" text-anchor="middle" fill="#10232b" font-size="15" font-weight="700">1</text><text x="87" y="164" fill="#f3fbfd" font-size="19" font-weight="700">Sender screen</text><text x="58" y="201" fill="#c0d4dc" font-size="15">Choose a small file</text><text x="58" y="228" fill="#c0d4dc" font-size="15">Prepare the QR sequence</text><text x="58" y="255" fill="#c0d4dc" font-size="15">Keep the full code visible</text><path d="M321 210 h18 m-6 -6 6 6 -6 6" fill="none" stroke="#94e1c8" stroke-width="3"/><rect x="346" y="128" width="278" height="170" rx="18" fill="#17333d" stroke="#3b6471"/><circle cx="374" cy="158" r="14" fill="#94e1c8"/><text x="374" y="163" text-anchor="middle" fill="#10232b" font-size="15" font-weight="700">2</text><text x="397" y="164" fill="#f3fbfd" font-size="19" font-weight="700">Receiver camera</text><text x="368" y="201" fill="#c0d4dc" font-size="15">Allow camera access</text><text x="368" y="228" fill="#c0d4dc" font-size="15">Scan missing data groups</text><text x="368" y="255" fill="#c0d4dc" font-size="15">Keep the page in view</text><path d="M631 210 h18 m-6 -6 6 6 -6 6" fill="none" stroke="#94e1c8" stroke-width="3"/><rect x="656" y="128" width="278" height="170" rx="18" fill="#17333d" stroke="#3b6471"/><circle cx="684" cy="158" r="14" fill="#94e1c8"/><text x="684" y="163" text-anchor="middle" fill="#10232b" font-size="15" font-weight="700">3</text><text x="707" y="164" fill="#f3fbfd" font-size="19" font-weight="700">Verified file</text><text x="678" y="201" fill="#c0d4dc" font-size="15">Wait for checksum checks</text><text x="678" y="228" fill="#c0d4dc" font-size="15">Download the result</text><text x="678" y="255" fill="#c0d4dc" font-size="15">Compare with the original</text><text x="36" y="340" fill="#94e1c8" font-size="15">The optical stream is not encrypted. Anyone who records it may reconstruct the file.</text></g></svg>
